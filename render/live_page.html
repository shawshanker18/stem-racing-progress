<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>STEM Racing · live</title>
<style>
:root{--bg:#0b0b0b;--panel:#121212;--line:#242424;--soft:#1a1a1a;--text:#ececec;--mute:#8c8c8c;--dim:#5c5c5c;--white:#f4f4f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
main{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:17px;font-weight:600;letter-spacing:.02em;margin:0}
h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:30px 0 10px}
.meta{color:var(--mute);font-size:12px}
button{appearance:none;border:1px solid #3a3a3a;background:var(--white);color:#0b0b0b;font:600 12px/1 inherit;letter-spacing:.08em;
text-transform:uppercase;padding:10px 16px;border-radius:4px;cursor:pointer;min-height:38px}
button:disabled{background:#2a2a2a;color:var(--mute);cursor:wait}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.grid{display:grid;gap:10px}
.agents{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.agent .t{font-weight:600}.agent .s{color:var(--mute);font-size:12px;margin-top:6px;min-height:36px}
.pill{display:inline-block;font:700 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;padding:5px 7px;border-radius:3px;margin-top:8px;white-space:nowrap}
.p-work{background:var(--white);color:#0b0b0b}.p-comp{background:#9a9a9a;color:#0b0b0b}.p-you{background:#0b0b0b;color:var(--white);outline:1px solid var(--white)}
.p-block{border:1px dashed #9a9a9a;color:#cfcfcf}.p-wait,.p-quiet{border:1px solid #3a3a3a;color:var(--mute)}.p-done{border:1px solid var(--white);color:var(--white)}
.gate{display:grid;grid-template-columns:minmax(150px,200px) 130px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}
.gate:last-child{border-bottom:0}
.ms{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:4px 0;color:var(--mute);font-size:13px}.ms.ok{color:var(--text)}
.accs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.acc.blocked{border-color:#e5484d;background:rgba(229,72,77,.12)}.acc.blocked .who{color:#e5484d;font-weight:600}
.acc .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.acc .who{color:var(--mute);font-size:12px}
.sq{display:grid;grid-template-columns:repeat(auto-fill,12px);gap:3px;margin-top:10px}
.sq i{width:12px;height:12px;border-radius:2px;background:#232323;border:1px solid #2e2e2e}
.sq i.on{background:var(--white);border-color:var(--white)}
i.p1{background:#f2f2f2;border-color:#f2f2f2}i.p2{background:#bdbdbd;border-color:#bdbdbd}
i.p3{background:#8a8a8a;border-color:#8a8a8a}i.p4{background:#5c5c5c;border-color:#5c5c5c}
i.p5{background:#3a3a3a;border-color:#cfcfcf}i.p0{background:repeating-linear-gradient(45deg,#9a9a9a 0 2px,#2a2a2a 2px 4px);border-color:#6a6a6a}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:0 0 10px;color:var(--mute);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:2px;border:1px solid #2e2e2e;display:inline-block}
.legend b{color:var(--text);font-weight:600}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0;border:1px solid #2e2e2e}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-weight:500;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.bar{height:4px;background:#262626;border-radius:2px;overflow:hidden;min-width:80px}.bar b{display:block;height:100%;background:var(--white)}
.sub{color:var(--mute);font-size:12px}
.part{display:grid;grid-template-columns:200px 1fr 110px;gap:14px;align-items:center}
.steps{display:flex;gap:3px;margin-top:8px}.steps i{flex:1;height:6px;border-radius:2px;background:#262626}
.steps i.done{background:var(--white)}.steps i.doing{background:#8c8c8c}.steps i.failed{background:#0b0b0b;outline:1px solid var(--white)}
.steps i.blocked{background:repeating-linear-gradient(45deg,#5a5a5a 0 3px,#262626 3px 6px)}
.empty{color:var(--dim);padding:6px 0}
.err{color:#ffffff;background:#2a2a2a;border:1px solid #444;padding:10px 12px;border-radius:4px;margin-top:12px;display:none}
footer{margin-top:36px;color:var(--dim);font-size:12px}a{color:var(--text)}
@media (max-width:760px){
 main{padding:16px 12px 48px}
 .gate{grid-template-columns:1fr auto}.gate .why{grid-column:1/-1}
 .part{grid-template-columns:1fr}
 .runs thead{display:none}.runs tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
 .runs td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}
 .runs td::before{content:attr(data-l);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
 .runs td .bar{flex:1;max-width:60%}
 .sq{grid-template-columns:repeat(auto-fill,10px);gap:3px}.sq i{width:10px;height:10px}
}
</style>
</head>
<body>
<main>
<header>
 <div><h1>STEM Racing · live</h1><div class="meta" id="meta">Loading…</div></div>
 <button id="refresh" type="button">Refresh</button>
</header>
<div class="err" id="err"></div>

<h2>Agents</h2><div class="agents" id="agents"></div>
<h2>Ready to start?</h2><div class="card" id="gates"></div>
<h2 id="mhead">Machines</h2><div class="legend" id="legend"></div><div class="accs" id="accounts"></div>
<h2 id="rhead">Running on GitHub</h2><div class="card" id="runs"></div>
<h2>Timelines</h2><div class="grid" id="parts"></div>

<footer id="foot"></footer>
</main>
<script>
const API = "__API_URL__";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(s){ if(!s) return ""; const m = Math.max(0, Math.round((Date.now() - Date.parse(s))/60000));
  if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.floor(m/60);
  return h < 48 ? h + " h " + (m%60) + " min ago" : Math.floor(h/24) + " days ago"; }
const PILL = {"WORKING":"p-work","WAITING ON COMPUTE":"p-comp","NEEDS YOU":"p-you","BLOCKED":"p-block",
              "WAITING TO START":"p-wait","QUIET":"p-quiet","SIGNED OFF":"p-done"};

function render(d){
  const busy = d.accounts.reduce((a,x)=>a+x.running,0), cap = d.accounts.reduce((a,x)=>a+x.cap,0),
        queued = d.accounts.reduce((a,x)=>a+x.queued,0);
  $("meta").innerHTML = `Data <span data-t="${esc(d.generated)}">${ago(d.generated)}</span> · ` +
    (d.source === "live" ? "live from GitHub" : "snapshot (updates every 5–15 min)") +
    ` · ${d.api_calls} GitHub calls` + (d.rate_remaining != null ? `, ${d.rate_remaining} left this hour` : "")
    + (d.source === "live" && !d.has_key ? ` · <b style="color:var(--white)">no GitHub key yet: only about 2 full refreshes an hour</b>` : "");

  const order = {"NEEDS YOU":0,"BLOCKED":1,"WAITING ON COMPUTE":2,"WORKING":3,"QUIET":4,"WAITING TO START":5,"SIGNED OFF":6};
  $("agents").innerHTML = [...d.parts].sort((a,b)=>(order[a.state]??9)-(order[b.state]??9) || a.part-b.part).map(p => `
    <div class="card agent"><div class="t">Agent ${p.part} · ${esc(p.name)}</div>
    <span class="pill ${PILL[p.state]||"p-quiet"}">${esc(p.state)}</span>
    <div class="s">${esc(p.state_detail)}${p.doing.length ? "<br>Step: " + esc(p.doing.join("; ")) : ""}</div>
    <div class="sub">Last update <span data-t="${esc(p.last_update||"")}">${p.last_update ? ago(p.last_update) : "unknown"}</span></div></div>`).join("");

  $("gates").innerHTML = (d.gates.length ? d.gates.map(g => {
    const name = (d.parts.find(p=>p.part===g.part)||{}).name || "";
    const why = g.ready ? "Everything it needs is finished and tested. You can start it." +
        (g.helpful_missing.length ? " Still coming (helpful, not required): " + g.helpful_missing.map(k=>`${k} from Part ${d.unlocks[k]?.part ?? "?"}`).join(", ") + "." : "")
      : "Waiting for " + g.missing.map(k => `${k} (${esc(d.unlocks[k]?.label || k)}, Part ${d.unlocks[k]?.part ?? "?"})`).join(", ") + ".";
    return `<div class="gate"><div><b>Part ${g.part}</b> · ${esc(name)}</div>
      <div><span class="pill ${g.ready?"p-work":"p-wait"}" style="margin:0">${g.ready?"READY TO START":"NOT YET"}</span></div>
      <div class="sub why">${why}</div></div>`; }).join("") : '<div class="empty">No start conditions set.</div>') +
    `<div style="margin-top:10px">` + Object.keys(d.unlocks).sort().map(k => { const u = d.unlocks[k];
      return `<div class="ms ${u.done?"ok":""}"><span class="mono">${u.done?"[x]":"[ ]"}</span><span>${esc(k)} · ${esc(u.label)} <span class="sub">(Part ${u.part})</span></span><span class="mono">${u.done?esc(u.date):"not yet"}</span></div>`; }).join("") + `</div>`;

  $("mhead").innerHTML = `Machines <span class="mono" style="color:var(--dim)">· ${busy}/${cap} busy${queued?`, ${queued} queued`:""}</span>`;
  const SHADE = {1:"p1",2:"p2",3:"p3",4:"p4",5:"p5",0:"p0"};
  const totals = {}; for (const a of d.accounts) for (const [k,v] of Object.entries(a.by_part||{})) totals[k] = (totals[k]||0) + v;
  const pname = k => k === "0" ? "unlabelled" : `Part ${k}`;
  $("legend").innerHTML = ["1","2","3","4","5","0"].map(k => `<span><i class="sq-l ${SHADE[k]}"></i>${pname(k)} <b class="mono">${totals[k]||0}</b></span>`).join("")
    + `<span><i style="background:#232323"></i>free <b class="mono">${cap-busy}</b></span>`;
  const cells = a => { const out = []; for (const k of ["1","2","3","4","5","0"]) for (let i=0;i<((a.by_part||{})[k]||0);i++) out.push(`<i class="${SHADE[k]}"></i>`);
    while (out.length < a.running) out.push('<i class="p0"></i>'); while (out.length < a.cap) out.push("<i></i>"); return out.slice(0, Math.max(a.cap, out.length)).join(""); };
  $("accounts").innerHTML = d.accounts.map(a => `
    <div class="card acc${a.blocked ? " blocked" : ""}"><div class="head"><div>${esc(a.name)}<div class="who">${a.blocked ? "BLOCKED · " + esc(a.note) : a.part ? "Part " + a.part : esc(a.note || "shared")}</div></div>
    <div class="mono">${a.running}/${a.cap}${a.queued ? `<div class="who">${a.queued} queued</div>` : ""}</div></div>
    <div class="sq" title="${a.running} of ${a.cap} machines running: ${Object.entries(a.by_part||{}).map(([k,v])=>pname(k)+" "+v).join(", ") || "none"}">${cells(a)}</div></div>`).join("");

  const runs = [...d.runs].sort((a,b)=>(a.status!=="in_progress")-(b.status!=="in_progress") || (a.part||9)-(b.part||9));
  $("rhead").innerHTML = `Running on GitHub <span class="mono" style="color:var(--dim)">· ${runs.length} runs</span>`;
  $("runs").innerHTML = runs.length ? `<table class="runs"><thead><tr><th>Part</th><th>What</th><th>State</th><th>Started</th><th>Progress</th></tr></thead><tbody>` +
    runs.map(r => `<tr><td data-l="Part"><i class="${SHADE[String(r.part||0)]} sw"></i>${r.part ? "Part " + r.part : "shared"}</td>
      <td data-l="What">${esc(r.title)}<div class="sub">${esc(r.account)}</div></td>
      <td data-l="State" class="sub">${r.status === "in_progress" ? "running" : "queued"}</td>
      <td data-l="Started" class="mono"><span data-t="${esc(r.started||"")}">${ago(r.started)}</span>${r.typical_min ? `<div class="sub">usually ${r.typical_min} min</div>` : ""}</td>
      <td data-l="Progress" style="min-width:150px"><div class="bar"><b style="width:${r.percent}%"></b></div>
      <div class="sub mono">${r.percent}% · ${r.jobs_done}/${r.jobs_total} jobs done${r.jobs_running?`, ${r.jobs_running} running`:""}${r.jobs_queued?`, ${r.jobs_queued} queued`:""}</div></td></tr>`).join("") +
    `</tbody></table>` : '<div class="empty">Nothing is running right now.</div>';

  $("parts").innerHTML = d.parts.map(p => `
    <div class="card part"><div><b>Part ${p.part}</b> · ${esc(p.name)}<div class="sub">${p.done}/${p.total} steps done</div></div>
    <div>${esc(p.now)}<div class="steps">${p.tasks.map(t=>`<i class="${esc(t.status)}" title="${esc(t.title)}: ${esc(t.status)}"></i>`).join("")}</div></div>
    <div class="sub mono" style="text-align:right">updated ${esc(p.updated)}</div></div>`).join("");

  $("foot").innerHTML = `Progress only, no code or design data. <a href="${esc(d.board)}">Board repository</a>`;
}

async function load(fresh){
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Refreshing…"; $("err").style.display = "none";
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const url = API.endsWith(".json") ? `${API}?t=${Date.now()}` : `${API}${fresh ? "?fresh=1" : ""}`;
    const r = await fetch(url, {cache: "no-store", signal: ctl.signal});
    if (!r.ok) throw new Error("the data source answered " + r.status);
    render(await r.json());
  } catch (e) {
    $("err").textContent = (e.name === "AbortError" ? "The server took over a minute, so I stopped waiting. Tap Refresh again."
      : "Could not load the latest data: " + e.message + ".") + " Showing what was loaded before, if anything.";
    $("err").style.display = "block";
  } finally { clearTimeout(timer); btn.disabled = false; btn.textContent = "Refresh"; }
}
$("refresh").addEventListener("click", () => load(true));
setInterval(() => { for (const e of document.querySelectorAll("[data-t]")) if (e.dataset.t) e.textContent = ago(e.dataset.t); }, 30000);
load(false);
</script>
</body>
</html>
