name: render

# Redraws the board (README, badges, progress map, history) whenever a part's progress
# file changes, and publishes the detailed pages to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["progress/**", "render/**", ".github/workflows/render.yml"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"      # the live panel: GitHub runs it every 5 to 15 minutes

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python render/render.py
      - run: python render/live.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the redrawn board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md board
          if ! git diff --cached --quiet; then
            git commit -m "Redraw the board [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
